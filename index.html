<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Clear Air</title>
<meta name="description" content="A calm companion for quitting smoking.">
<meta name="theme-color" content="#F7F9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1714" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Clear Air">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="preload" href="./fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Fraunces";src:url("./fonts/fraunces.woff2") format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Inter";src:url("./fonts/inter-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Inter";src:url("./fonts/inter-500.woff2") format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"Inter";src:url("./fonts/inter-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Inter";src:url("./fonts/inter-700.woff2") format("woff2");font-weight:700;font-display:swap}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}
html{overscroll-behavior-y:none}
</style>
<style>
/* Clear Air design system (Style Tile v0.1, Direction A). Layout: phone column, three-item bottom nav (Home · Milestones · You) with a floating SOS button on every screen; SOS and logging open as spring sheets. */
:root{
  --bg:#F7F9F6; --surface:#FFFFFF; --surface-muted:#EEF4F0; --ink:#1C2B24; --ink-muted:#5B6B64; --line:#D7E2DC;
  --brand:#1DBA8A; --brand-deep:#0E7A5C; --brand-soft:#D8F5EA; --on-brand:#0F1714;
  --sky:#7EC8C3; --sky-soft:#E1F2F0; --sky-deep:#2E6E6A;
  --gold:#E8B84A; --gold-soft:#FBF3DC; --gold-deep:#86621A;
  --lilac:#B8A6E8; --lilac-soft:#EFEAFB; --lilac-deep:#5A4A98;
  --sos:#E25B4A; --warn:#E9A23B;
  --hero:#0F1714; --hero-ink:#F2F6F3; --hero-muted:#9AABA3;
  --display:"Fraunces", Georgia, "Times New Roman", serif;
  --ui:"Inter", "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r-card:16px; --r-sheet:24px; --r-hero:20px; --pill:999px; --u:4px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1714; --surface:#18211D; --surface-muted:#1F2A25; --ink:#E6EFEA; --ink-muted:#95A69E; --line:#2A3832;
  --brand:#3ED9A5; --brand-deep:#8BEACB; --brand-soft:#16372C; --on-brand:#0F1714;
  --sky-soft:#173134; --sky-deep:#A6DDD9; --gold-soft:#342B16; --gold-deep:#F0CD7C; --lilac-soft:#2A2440; --lilac-deep:#CFC2F2;
  --hero:#18211D; --hero-ink:#F2F6F3; --hero-muted:#9AABA3; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1714; --surface:#18211D; --surface-muted:#1F2A25; --ink:#E6EFEA; --ink-muted:#95A69E; --line:#2A3832;
  --brand:#3ED9A5; --brand-deep:#8BEACB; --brand-soft:#16372C; --on-brand:#0F1714;
  --sky-soft:#173134; --sky-deep:#A6DDD9; --gold-soft:#342B16; --gold-deep:#F0CD7C; --lilac-soft:#2A2440; --lilac-deep:#CFC2F2;
  --hero:#18211D; --hero-ink:#F2F6F3; --hero-muted:#9AABA3; color-scheme:dark}
html,body{height:100%}
body{--knock:var(--surface);background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:24px}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:440px;margin:0 auto;padding-inline:16px;padding-block:12px 176px;display:flex;flex-direction:column;gap:calc(var(--u)*3)}
h1,h2,h3{margin:0;text-wrap:balance}
.fr{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:800;letter-spacing:-.01em}
.screen-title{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:800;font-size:28px;line-height:34px}
.kicker{font-size:13px;line-height:18px;font-weight:500;color:var(--ink-muted)}
.label{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted)}
.meta{font-size:13px;line-height:18px;font-weight:500;color:var(--ink-muted)}
.title{font-size:16px;line-height:22px;font-weight:600}
.num{font-variant-numeric:tabular-nums lining-nums}
.appbar{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:15px;padding-block:4px}
.appbar .ic{color:var(--brand)}
.ic{width:24px;height:24px;flex:none;display:block}
.ic.s20{width:20px;height:20px}
.ic.flip{transform:scaleX(-1)}
.head{display:flex;flex-direction:column;gap:2px;padding-top:8px}
.notice{background:var(--surface-muted);border-radius:12px;padding:10px 12px;font-size:13px;line-height:18px;color:var(--ink-muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;display:flex;flex-direction:column;gap:12px}
.well{border-radius:var(--r-card);padding:14px 12px;display:grid;grid-template-columns:24px 1fr;column-gap:10px;align-items:center;min-width:0}
.well>div{display:flex;flex-direction:column;min-width:0}
.well b{font-size:20px;line-height:26px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.well span{font-size:13px;line-height:18px;font-weight:500}
.t-brand{background:var(--brand-soft);color:var(--brand-deep)}
.t-gold{background:var(--gold-soft);color:var(--gold-deep)}
.t-sky{background:var(--sky-soft);color:var(--sky-deep)}
.t-lilac{background:var(--lilac-soft);color:var(--lilac-deep)}
.t-muted{background:var(--surface-muted);color:var(--ink)}
.bento{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* hero */
.hero{background:var(--hero);color:var(--hero-ink);border-radius:var(--r-hero);padding:18px 18px 20px;display:flex;flex-direction:column;gap:18px;border:1px solid var(--line)}
.hero .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero .label{color:var(--hero-muted)}
.pill{border-radius:var(--pill);padding:3px 12px;font-size:13px;line-height:18px;font-weight:600;background:var(--brand);color:var(--on-brand)}
.bigrow{display:flex;align-items:baseline;gap:10px}
.big{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:900;font-size:56px;line-height:52px;font-variant-numeric:tabular-nums lining-nums}
.bigunit{font-size:16px;color:var(--hero-muted);font-weight:500}
.clock{display:flex;gap:22px;align-items:baseline}
.clock b{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:900;font-size:26px;line-height:28px;font-variant-numeric:tabular-nums lining-nums}
.clock span{font-size:11px;color:var(--hero-muted);margin-left:3px;font-weight:500}
.hero .foot{font-size:13px;line-height:18px;color:var(--hero-muted)}
/* rows & buttons */
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:var(--pill);padding:12px 18px;font-size:15px;line-height:20px;font-weight:500;background:var(--surface-muted);color:var(--ink)}
.btn.primary{background:var(--brand);color:var(--on-brand);font-weight:600}
.btn.dark{background:var(--ink);color:var(--bg);font-weight:600}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.grow{flex:1}
.btn.block{width:100%;padding-block:15px}
.link{background:none;border:0;padding:0;color:var(--ink-muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.peek{display:grid;grid-template-columns:32px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;width:100%}
.tick{color:var(--ink-muted)}
.tick.on{color:var(--brand-deep)}
.status{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--brand)}
.dot.m{background:var(--ink-muted)}
/* mission */
.mission{border-radius:var(--r-card);border:1px solid var(--line);background:var(--surface);overflow:hidden}
.mission .band{background:var(--brand);color:var(--on-brand);padding:14px 18px 22px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:0 0 var(--r-card) var(--r-card)}
.mission .body{padding:18px;display:flex;flex-direction:column;gap:14px}
.mission h3{font-size:20px;line-height:26px;font-weight:600}
.bul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;line-height:18px;color:var(--ink-muted)}
.bul li{display:flex;gap:10px;align-items:baseline}
.bul li:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);flex:none;transform:translateY(-1px)}
.banner{border-radius:var(--r-card);padding:14px 16px;font-size:13px;line-height:18px;font-weight:500}
.banner .title{font-size:15px}
textarea,input[type=number],input[type=date],input[type=text],input[type=tel]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:88px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-muted)}
/* timeline */
.tl{display:flex;flex-direction:column}
.node{display:grid;grid-template-columns:28px 1fr;gap:14px;position:relative;padding-bottom:10px}
.node:before{content:"";position:absolute;left:13px;top:30px;bottom:-2px;width:2px;background:var(--line)}
.node.done:before{background:var(--brand)}
.node:last-child:before{display:none}
.ring{width:28px;height:28px;display:grid;place-items:center;margin-top:12px;color:var(--ink-muted);background:var(--bg);--knock:var(--bg)}
.node.done .ring{color:var(--brand-deep)}
.node.next .ring{color:var(--gold)}
.ncard{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-card);padding:12px 14px}
.node.latest .ncard{background:var(--brand-soft);border-color:transparent}
.node.next .ncard{border-color:var(--gold)}
.ncard summary{list-style:none;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.ncard summary::-webkit-details-marker{display:none}
.ncard .when{font-size:15px;font-weight:600}
.ncard .what{font-size:13px;line-height:18px;color:var(--ink-muted)}
.node.latest .ncard .what{color:var(--brand-deep)}
.ncard .why{font-size:13px;line-height:19px;color:var(--ink-muted);margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line)}
/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);width:36px;height:36px;display:grid;place-items:center;font-size:18px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;text-align:center;color:var(--ink-muted);font-weight:600}
.cell{aspect-ratio:1;max-width:100%;border-radius:10px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-variant-numeric:tabular-nums;padding:0;color:var(--ink-muted)}
.cell .d{font-size:13px;font-weight:600}
.cell .c{font-size:10px;font-weight:600;line-height:12px}
.cell.free{background:var(--brand-soft);color:var(--brand-deep)}
.cell.smoked{background:var(--surface-muted);color:var(--ink-muted)}
.cell.future{opacity:.4}
.cell.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cell .m{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--lilac)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-muted)}
.legend span{display:flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
/* diary */
.entries{display:flex;flex-direction:column;gap:8px}
.entry{border-radius:14px;background:var(--lilac-soft);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.entry .top{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--lilac-deep);font-weight:600}
.entry p{margin:0;font-size:15px;line-height:22px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipv{font-size:12px;line-height:16px;padding:3px 9px;border-radius:var(--pill);background:var(--surface);color:var(--ink-muted);font-weight:500}
.reason{border-radius:14px;padding:14px 16px;background:var(--gold-soft);color:var(--ink);font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:600;font-size:18px;line-height:24px;overflow-wrap:anywhere}
.hbars{display:flex;flex-direction:column;gap:8px}
.hb{display:grid;grid-template-columns:92px 1fr 24px;gap:8px;align-items:center;font-size:13px}
.hb .t{height:8px;border-radius:99px;background:var(--surface-muted);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--sky);border-radius:99px}
.hb .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:15px}
.kv dt{color:var(--ink-muted)} .kv dd{margin:0;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5;pointer-events:none}
.nav .in{pointer-events:auto;width:100%;max-width:416px;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:8px 6px;box-shadow:0 8px 24px rgba(15,23,20,.08)}
.nb{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-muted);padding:4px 0}
.nw{width:52px;height:32px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.nb[aria-current="page"]{color:var(--brand-deep)}
.nb[aria-current="page"] .nw{background:var(--brand-soft);color:var(--brand-deep)}
.sosfab{position:fixed;z-index:6;right:max(16px,calc(50% - 204px));bottom:calc(100px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;background:var(--sos);color:#fff;font-weight:700;font-size:10px;letter-spacing:.06em;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;box-shadow:0 6px 18px rgba(226,91,74,.35),0 0 0 4px var(--bg)}
.sosfab:active{transform:scale(.96)}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(15,23,20,.5);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:440px;max-height:94%;overflow:auto;border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet-top{display:flex;justify-content:flex-end;margin:-4px -6px -10px}
.xbtn{border:0;background:var(--surface-muted);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;color:var(--ink)}
.xbtn .ic{width:20px;height:20px}
.bn-ic{display:flex;gap:10px;align-items:flex-start}
.bn-ic .ic{margin-top:-1px}
.moods{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mood{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:0}
.mood b{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:800;font-size:22px;line-height:28px}
.mood span{font-size:11px;color:var(--ink-muted);font-weight:500}
.mood[aria-pressed="true"]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-deep)}
.mood[aria-pressed="true"] span{color:var(--brand-deep)}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--pill);padding:6px 12px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-deep);border-color:var(--brand)}
.stepper{display:flex;align-items:center;justify-content:center;gap:22px}
.stepper button{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:24px;line-height:1}
.stepper output{font-family:var(--display);font-variation-settings:"SOFT" 100;font-weight:900;font-size:52px;line-height:56px;min-width:80px;text-align:center;font-variant-numeric:tabular-nums lining-nums}
/* breath */
.breath{display:grid;place-items:center;padding-block:14px}
.bring{width:176px;height:176px;border-radius:50%;background:var(--brand-soft);display:grid;place-items:center}
.bcore{width:124px;height:124px;border-radius:50%;border:3px solid var(--brand);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform 4s ease-in-out}
.bcore b{font-size:18px;font-weight:600;color:var(--brand-deep);letter-spacing:.04em}
.bcore span{font-size:12px;color:var(--ink-muted)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tool{border:0;border-radius:14px;padding:14px 6px 12px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.tool[aria-pressed="true"]{box-shadow:inset 0 0 0 2px currentColor}
.game{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.game button{aspect-ratio:1;border-radius:50%;border:0;background:var(--surface-muted)}
.game button.lit{background:var(--gold)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.toggle input{width:22px;height:22px;accent-color:var(--brand)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(164px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:var(--pill);font-weight:500;z-index:20;font-size:13px;max-width:calc(100% - 32px);text-align:center}
.sources{font-size:12px;line-height:17px;color:var(--ink-muted)}
.sources a{color:inherit}
@media (prefers-reduced-motion: no-preference){.sheet{animation:spring .38s cubic-bezier(.2,1.25,.4,1)}@keyframes spring{from{transform:translateY(40px);opacity:.4}}}
@media (prefers-reduced-motion: reduce){.bcore{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="appbar"><svg class="ic s20" aria-hidden="true"><use href="#i-leaf-f"/></svg>Clear Air</div>
  <div class="card"><span class="label">Opening</span><span class="meta">Loading your log…</span></div>
</div>
<nav class="nav" id="nav" hidden>
  <div class="in">
    <button class="nb" id="nb-home" data-tab="home"><span class="nw"><svg class="ic" aria-hidden="true"><use data-i="home" href="#i-home"/></svg></span>Home</button>
    <button class="nb" id="nb-body" data-tab="body"><span class="nw"><svg class="ic" aria-hidden="true"><use data-i="milestone" href="#i-milestone"/></svg></span>Milestones</button>
    <button class="nb" id="nb-you" data-tab="you"><span class="nw"><svg class="ic" aria-hidden="true"><use data-i="profile" href="#i-profile"/></svg></span>You</button>
  </div>
</nav>
<button class="sosfab" id="sos-fab" hidden aria-label="SOS: craving help"><svg class="ic" aria-hidden="true"><use href="#i-sos"/></svg>SOS</button>

/* ---------- on-device store (replaces the Claude runtime's db) ---------- */
const LocalDB=(()=>{
  const KEY="clearair.v1";let mem={},ok=true;
  try{mem=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){ok=false}
  const listeners=new Set(),segs=p=>p.split("/"),clone=v=>JSON.parse(JSON.stringify(v));
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(mem))}catch(e){throw {code:"quota_exceeded",message:String(e)}}};
  const fire=()=>setTimeout(()=>listeners.forEach(l=>l()),0);
  const snap=p=>{const d=mem[p];return{id:segs(p).pop(),exists:d!==undefined,data:()=>d===undefined?undefined:clone(d)}};
  const q=(col,o)=>{const n=segs(col).length+1;let docs=Object.keys(mem).filter(p=>p.startsWith(col+"/")&&segs(p).length===n).map(snap);
    if(o.order){const[f,dir]=o.order;docs.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];return(x<y?-1:x>y?1:0)*(dir==="desc"?-1:1)})}else docs.sort((a,b)=>a.id<b.id?-1:1);
    if(o.limit)docs=docs.slice(0,o.limit);return{docs,size:docs.length,empty:!docs.length}};
  const merge=(a,b)=>{const o={...a};for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))o[k]=merge(o[k],b[k]);else o[k]=b[k]}return o};
  const rid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  const doc=p=>({id:segs(p).pop(),path:p,
    get:async()=>snap(p),
    set:async d=>{mem[p]=clone(d);persist();fire()},
    update:async d=>{if(!(p in mem))throw{code:"invalid_argument"};mem[p]=merge(mem[p],clone(d));persist();fire()},
    delete:async()=>{delete mem[p];persist();fire()},
    onSnapshot:next=>{const l=()=>next(snap(p));listeners.add(l);setTimeout(l,0);return()=>listeners.delete(l)},
    collection:sub=>col(p+"/"+sub)});
  const col=(p,o={})=>({path:p,
    orderBy:(f,dir="asc")=>col(p,{...o,order:[f,dir]}),limit:n=>col(p,{...o,limit:n}),
    get:async()=>q(p,o),
    onSnapshot:next=>{const l=()=>next(q(p,o));listeners.add(l);setTimeout(l,0);return()=>listeners.delete(l)},
    doc:id=>doc(p+"/"+(id||rid())),
    add:async d=>{const r=doc(p+"/"+rid());await r.set(d);return r}});
  return{ok,doc,collection:col,
    dump:()=>clone(mem),
    replaceAll:data=>{mem=clone(data);persist();fire()}};
})();
window.__store=()=>LocalDB.dump();

/* ---------- state ---------- */
const S={mode:"loading",tab:"home",profile:null,days:{},checkins:[],missions:{},reasons:[],calMonth:null,refs:null};

/* ---------- derived ---------- */
const smoked=k=>!!(S.days[k]&&S.days[k].count>0);
function streaks(){
  const p=S.profile,t=todayKey();
  if(!p||p.quitDate>t) return {current:0,longest:p?(p.bestStreak||0):0,free:0,elapsed:0};
  let cur=0,best=0,free=0;
  for(let k=p.quitDate;k<=t;k=addDays(k,1)){ if(smoked(k)){cur=0}else{cur++;free++;if(cur>best)best=cur} }
  return {current:cur,longest:Math.max(best,p.bestStreak||0),free,elapsed:diffDays(p.quitDate,t)+1};
}
function smokedSince(k0){let n=0;const t=todayKey();for(const k in S.days){if(k>=k0&&k<=t)n+=S.days[k].count||0}return n}
function avoided(){const p=S.profile;if(!p||p.quitDate>todayKey())return 0;return Math.max(0,Math.round(p.perDay*streaks().elapsed-smokedSince(p.quitDate)))}
function clockStart(){
  const p=S.profile;if(!p)return null;
  let start=parseKey(p.quitDate).getTime();const t=todayKey();
  const ks=Object.keys(S.days).filter(k=>k>=p.quitDate&&k<=t&&smoked(k)).sort();
  if(ks.length){const k=ks[ks.length-1];const at=S.days[k].lastAt?Date.parse(S.days[k].lastAt):parseKey(addDays(k,1)).getTime()-60000;start=Math.max(start,at)}
  return start;
}
function hoursClean(){const s=clockStart();return s==null?0:Math.max(0,(Date.now()-s)/36e5)}
function compact(h){
  if(h<1) return `${Math.max(1,Math.round(h*60))}m`;
  if(h<72) return `${Math.round(h)}h`;
  if(h<24*60) return `${Math.round(h/24)}d`;
  if(h<Y*2) return `${Math.round(h/24/30.4)}mo`;
  return `${Math.round(h/Y)}y`;
}
function dh(mins){const d=Math.floor(mins/1440),h=Math.floor(mins%1440/60),m=Math.round(mins%60);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`}
function longDur(h){if(h<1)return `${Math.max(1,Math.round(h*60))} minutes`;if(h<48)return `${Math.round(h)} hours`;if(h<24*60)return `${Math.round(h/24)} days`;if(h<Y*2)return `${Math.round(h/24/30.4)} months`;return `${(h/Y).toFixed(1)} years`}
const money=n=>(S.profile&&S.profile.currency||"₹")+Math.round(n).toLocaleString("en-IN");
const checkinsOn=k=>S.checkins.filter(c=>keyOf(new Date(c.at))===k);
function dayNum(){const p=S.profile;if(!p)return 0;const t=todayKey();return p.quitDate>t?0:diffDays(p.quitDate,t)+1}
function missionToday(){const n=dayNum();const i=n<1?0:(n-1)%MISSIONS.length;return {i,n:i+1,m:MISSIONS[i]}}
function nextMilestone(h){return MILESTONES.find(m=>m.h>h)}

/* ---------- storage ---------- */
async function initStore(){
  if(!LocalDB.ok){ loadExample(); return; }
  const base=LocalDB.doc("data/users/local/profile");
  S.refs={base,days:base.collection("days"),checkins:base.collection("checkins"),meta:base.collection("meta")};
  const got={p:0,d:0,c:0,m:0};
  const settle=()=>{ if(got.p&&got.d&&got.c&&got.m){ S.mode=S.profile?"live":"setup"; render(); } };
  base.onSnapshot(s=>{S.profile=s.exists?s.data():null;got.p=1;settle()},onErr);
  S.refs.days.onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S.days=m;got.d=1;settle()},onErr);
  S.refs.checkins.orderBy("at","desc").limit(400).onSnapshot(s=>{S.checkins=s.docs.map(d=>Object.assign({id:d.id},d.data()));got.c=1;settle()},onErr);
  S.refs.meta.onSnapshot(s=>{S.missions={};S.reasons=[];s.docs.forEach(d=>{const v=d.data();if(d.id==="missions")S.missions=v.done||{};if(d.id==="reasons")S.reasons=v.items||[]});got.m=1;settle()},onErr);
}
function onErr(e){toast(e&&e.code==="quota_exceeded"?"Storage is full.":"Couldn't reach your saved data. Changes may not save.")}
function loadExample(){
  S.mode="example";
  const t=todayKey(),q=addDays(t,-11);
  S.profile={quitDate:q,startDate:q,perDay:10,price:18,currency:"₹",bestStreak:0,buddyName:"",buddyPhone:""};
  S.days={};
  S.checkins=[
    {id:"e1",at:new Date(Date.now()-2*36e5).toISOString(),mood:4,tags:["Proud","Calm"],note:"Walked past the tea stall without stopping."},
    {id:"e2",at:new Date(Date.now()-26*36e5).toISOString(),craving:true,intensity:4,tags:["Stressed","At work"],note:"Big review. Rode it out with the breathing."},
    {id:"e3",at:new Date(Date.now()-50*36e5).toISOString(),craving:true,intensity:3,tags:["After coffee"],note:""}
  ];
  S.reasons=[{id:"r1",text:"I want to run with my niece without stopping for breath.",at:new Date().toISOString()}];
  S.missions={};S.missions[addDays(t,-11)]={n:1};
  render();
}
async function write(fn,okMsg){
  if(S.mode==="example"){toast("This browser is blocking storage, so nothing can be saved.");return false}
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){toast(e&&e.code==="quota_exceeded"?"Storage is full.":"That didn't save. Try again.");return false}
}

/* ---------- render ---------- */
const app=document.getElementById("app");
function render(){
  const nav=document.getElementById("nav");
  if(S.mode==="loading")return;
  const fab=document.getElementById("sos-fab");fab.hidden=S.mode==="setup";
  if(S.mode==="setup"){nav.hidden=true;app.innerHTML=setupView();bindSetup();return}
  nav.hidden=false;
  document.querySelectorAll(".nb[data-tab]").forEach(b=>{const on=b.dataset.tab===S.tab,u=b.querySelector("use");if(on)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current");u.setAttribute("href","#i-"+u.dataset.i+(on?"-f":""))});
  const banner=S.mode==="example"?`<div class="notice">Example data. This browser is blocking storage, so your log can’t be saved here. Turn off private browsing and reopen Clear Air.</div>`:"";
  app.innerHTML=banner+(S.tab==="home"?homeView():S.tab==="body"?bodyView():youView());
  bindView();tickClock();
}

/* BODY */
function bodyView(){
  const p=S.profile,pre=p.quitDate>todayKey(),h=pre?0:hoursClean();
  let latest=-1;MILESTONES.forEach((m,i)=>{if(h>=m.h)latest=i});
  const nx=nextMilestone(h);
  const nodes=MILESTONES.map((m,i)=>{
    const cls=i<latest?"done":i===latest?"done latest":m===nx?"next":"";
    return `<div class="node ${cls}"><div class="ring">${I(i<=latest?"check-circle-f":m===nx?"milestone":"sprout")}</div><details class="ncard"><summary><span class="when">${esc(m.when)}</span><span class="what">${esc(m.what)}</span></summary><p class="why">${esc(m.why)}</p></details></div>`;
  }).join("");
  return `<div class="head"><span class="kicker">Milestones</span><h1 class="screen-title">What's returning.</h1><span class="meta">${pre?"The clock starts on your quit day.":"Counted from your last cigarette, "+esc(longDur(h))+" ago. Tap any stage for the science."}</span></div>

    ${nx?`<div class="banner t-gold" style="text-align:center">Next unlock in <b class="num">${esc(longDur(nx.h-h))}</b></div>`:""}

}

function entryHTML(c){

function patternsBlock(){
  const cr=S.checkins.filter(c=>c.craving);
  if(!cr.length) return `<section class="card"><span class="label">Craving patterns</span><span class="meta">Each time you use SOS and tap "I'm through it", the craving is logged. After a few, this shows which hours and situations bring them on.</span></section>`;
  const tc={};cr.forEach(c=>(c.tags||[]).forEach(t=>tc[t]=(tc[t]||0)+1));
  const top=Object.entries(tc).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const B=[["Morning",5,12],["Afternoon",12,17],["Evening",17,21],["Night",21,29]].map(([n,a,b])=>[n,cr.filter(c=>{let hr=new Date(c.at).getHours();if(hr<5)hr+=24;return hr>=a&&hr<b}).length]);
  const bars=r=>{const mx=Math.max(1,...r.map(x=>x[1]));return `<div class="hbars">${r.map(([n,v])=>`<div class="hb"><span>${esc(n)}</span><span class="t"><i style="width:${(v/mx*100).toFixed(0)}%"></i></span><span class="v">${v}</span></div>`).join("")}</div>`};
  const ints=cr.filter(c=>c.intensity);const avg=ints.length?(ints.reduce((a,c)=>a+c.intensity,0)/ints.length).toFixed(1):null;
  return `<section class="card"><span class="label">Craving patterns</span><span class="meta num">${cr.length} ridden out${avg?` · average strength ${avg}/5`:""}</span>${bars(B)}${top.length?`<span class="label" style="margin-top:4px">What was going on</span>${bars(top)}`:""}</section>`;
}

function openSOS(){
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let timers=[];const clear=()=>{timers.forEach(clearInterval);timers=[]};
  sheet(`<h2 class="screen-title">Craving hit.</h2><span class="meta" style="margin-top:-8px">This usually lasts 3–5 minutes. Ride it.</span>
    <div id="sos-stage"></div>
    <div class="tools"><button class="tool t-brand" data-tool="breathe" aria-pressed="true">${I("breath")}Breathe</button><button class="tool t-gold" data-tool="game" aria-pressed="false">${I("game")}60s game</button><button class="tool t-lilac" data-tool="buddy" aria-pressed="false">${I("message")}Text a buddy</button></div>
    <button class="btn dark block" id="sos-done">I'm through it</button>
    <button class="link" id="sos-smoked" style="align-self:center">I smoked. Log it.</button>`,()=>{
    const stage=document.getElementById("sos-stage");
    const breathe=()=>{
      clear();
      stage.innerHTML=`<div class="breath"><div class="bring"><div class="bcore" id="bcore"><b id="bph">IN</b><span id="bsec">4 seconds</span></div></div></div><div class="meta" style="text-align:center" id="bcyc">Box breath · 4 cycles left</div>`;
      const phases=[["IN",1.28],["HOLD",1.28],["OUT",1],["HOLD",1]];let step=0,sec=4,cyc=4;
      const core=document.getElementById("bcore");
      const show=()=>{const [ph,sc]=phases[step];document.getElementById("bph").textContent=ph;document.getElementById("bsec").textContent=`${sec} second${sec===1?"":"s"}`;if(!reduce)core.style.transform=`scale(${sc})`;};
      requestAnimationFrame(show);
      timers.push(setInterval(()=>{
        sec--; if(sec===0){sec=4;step=(step+1)%4;if(step===0){cyc--;if(cyc===0){clear();document.getElementById("bph").textContent="DONE";document.getElementById("bsec").textContent="Nice work";core.style.transform="scale(1)";document.getElementById("bcyc").textContent="Four cycles. Go again, or tap I'm through it.";return}document.getElementById("bcyc").textContent=`Box breath · ${cyc} cycle${cyc===1?"":"s"} left`}}
        show();
      },1000));
    };
    const game=()=>{
      clear();let score=0,left=60,lit=-1;
      stage.innerHTML=`<div class="row" style="justify-content:space-between;align-items:baseline"><span class="title">Tap the gold dot</span><span class="meta num" id="g-t">60s · 0 hits</span></div><div class="game" id="g">${Array.from({length:16},(_,i)=>`<button data-i="${i}" aria-label="Dot ${i+1}"></button>`).join("")}</div>`;
      const g=document.getElementById("g"),btns=[...g.children];
      const move=()=>{if(lit>=0)btns[lit].classList.remove("lit");let n;do{n=Math.floor(Math.random()*16)}while(n===lit);lit=n;btns[lit].classList.add("lit")};
      g.onclick=e=>{const b=e.target.closest("button");if(!b||left<=0)return;if(+b.dataset.i===lit){score++;move()}document.getElementById("g-t").textContent=`${left}s · ${score} hits`};
      move();
      timers.push(setInterval(()=>{left--;document.getElementById("g-t").textContent=`${left}s · ${score} hits`;if(left<=0){clear();btns[lit].classList.remove("lit");document.getElementById("g-t").textContent=`Time. ${score} hits. A minute of the craving is gone.`}},1000));
    };
    const buddy=()=>{
      clear();const p=S.profile||{};
      if(!p.buddyPhone){stage.innerHTML=`<div class="banner t-lilac"><div class="title" style="color:var(--ink)">No buddy yet.</div><div>Add a name and number in You → Settings. Then this button puts them one tap away.</div></div>`;return}
      stage.innerHTML=`<div class="banner t-lilac" style="display:flex;flex-direction:column;gap:10px"><div class="title" style="color:var(--ink)">${esc(p.buddyName||"Your buddy")}</div><div class="num" style="font-size:18px;color:var(--ink);user-select:all">${esc(p.buddyPhone)}</div>
        <div class="row"><a class="btn" style="background:var(--surface);text-decoration:none" href="sms:${encodeURIComponent(p.buddyPhone)}?&body=${encodeURIComponent("Craving hit. Talk to me for 5 minutes?")}">Open messages</a><button class="btn" style="background:var(--surface)" id="b-copy">Copy number</button></div>
        <span class="meta">Suggested text: "Craving hit. Talk to me for 5 minutes?"</span></div>`;
      document.getElementById("b-copy").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(p.buddyPhone).then(()=>toast("Number copied"),()=>toast("Select the number to copy it"))};
    };
    const tools={breathe,game,buddy};
    root.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{root.querySelectorAll("[data-tool]").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));tools[b.dataset.tool]()});
    breathe();
    cleanup=clear;
    document.getElementById("sos-done").onclick=()=>openAfterCraving();
    document.getElementById("sos-smoked").onclick=()=>openDay(todayKey(),true);
  });
}

function openDay(k,smokedNow){

  const list=checkinsOn(k);
  sheet(`<span class="kicker">${esc(fmtDay(k))}</span><h2 class="screen-title" style="margin-top:-10px">Cigarettes smoked</h2>
    <div class="stepper"><button id="d-minus" aria-label="One fewer">−</button><output id="d-n">${n}</output><button id="d-plus" aria-label="One more">+</button></div>

async function saveDay(k,n){
  const prev=S.days[k]?S.days[k].count:0,body={count:n};
  if(n>0)body.lastAt=k===todayKey()?new Date().toISOString():new Date(parseKey(addDays(k,1)).getTime()-60000).toISOString();
  const ok=await write(()=>S.refs.days.doc(k).set(body),n===0?"Smoke-free day logged":null);
  if(!ok)return;
  S.days=Object.assign({},S.days,{[k]:body}); // reflect the write now; the live snapshot confirms it
  if(n>0&&prev===0&&k>=S.profile.quitDate)openSlip(k,n,streaks().longest);else if(n>0)toast("Updated");else render();
}
function openSlip(k,n,best){
  const p=S.profile;
  sheet(`<span class="kicker">${n} logged · ${esc(fmtDay(k))}</span><h2 class="screen-title" style="margin-top:-10px">A slip, not a restart.</h2>
    <p class="meta" style="margin:0;font-size:15px;line-height:22px">Your best streak stays at ${best} ${best===1?"day":"days"}. Every smoke-free day before this still counts. People who treat a slip as a one-off are more likely to stay quit.</p>
    <button class="btn primary block" id="sl-keep">Keep my quit date (${esc(fmtDay(p.quitDate))})</button>
    <div class="card" style="gap:10px"><label class="f" for="sl-date">Or set a new quit date<input type="date" id="sl-date" value="${addDays(todayKey(),1)}"></label><button class="btn block" id="sl-new">Set new date</button></div>
    <button class="link" id="sl-note" style="align-self:center">Write what set it off</button>`,()=>{
      document.getElementById("sl-keep").onclick=async()=>{if(await write(()=>S.refs.base.update({bestStreak:Math.max(best,p.bestStreak||0)}),"Quit date kept. The clock restarts from your last cigarette."))closeSheet()};
      document.getElementById("sl-note").onclick=openCheckin;
      document.getElementById("sl-new").onclick=async()=>{
        const q=document.getElementById("sl-date").value;if(!q)return;
        if(await write(()=>S.refs.base.update({quitDate:q,bestStreak:Math.max(best,p.bestStreak||0)}),`New quit date: ${fmtDay(q)}`))closeSheet();
      };
    });
}

/* SETTINGS */
function openSettings(){
  const p=S.profile;
  sheet(`<h2 class="screen-title">Settings</h2>
    <label class="f" for="st-quit">Quit date<input type="date" id="st-quit" value="${p.quitDate}"></label>
    <label class="f" for="st-per">Cigarettes a day before quitting<input type="number" id="st-per" min="1" max="100" value="${p.perDay}"></label>
    <label class="f" for="st-price">Price per cigarette (₹)<input type="number" id="st-price" min="0" step="0.5" value="${p.price}"></label>
    <label class="f" for="st-bn">SOS buddy's name<input type="text" id="st-bn" value="${esc(p.buddyName||"")}" maxlength="60"></label>
    <label class="f" for="st-bp">SOS buddy's phone<input type="tel" id="st-bp" value="${esc(p.buddyPhone||"")}" maxlength="24"></label>
    <span class="meta">Changing the quit date keeps your best streak.</span>
    <button class="btn primary block" id="st-save">Save</button>
    <div class="card" style="gap:10px"><span class="label">Your data</span>
      <span class="meta">Everything is stored on this phone only. Save a backup now and then, and before you delete the app or switch phones.</span>
      <button class="btn block" id="st-export">Save a backup</button>
      <label class="btn block" for="st-import" style="text-align:center;cursor:pointer">Restore from a backup</label>
      <input type="file" id="st-import" accept="application/json,.json" hidden>
      <div id="st-restore"></div></div>`,()=>{
      document.getElementById("st-export").onclick=exportBackup;
      document.getElementById("st-import").onchange=e=>readBackup(e.target.files[0]);
      document.getElementById("st-save").onclick=async()=>{
        const q=document.getElementById("st-quit").value,per=+document.getElementById("st-per").value,pr=+document.getElementById("st-price").value;
        if(!q||!(per>0))return toast("Add a quit date and a daily count.");
        const best=Math.max(streaks().longest,p.bestStreak||0);
        if(await write(()=>S.refs.base.update({quitDate:q,perDay:per,price:pr||0,bestStreak:best,buddyName:document.getElementById("st-bn").value.trim(),buddyPhone:document.getElementById("st-bp").value.trim()}),"Saved"))closeSheet();
      };
    });
}


/* ---------- backup ---------- */
async function exportBackup(){
  const data={app:"clear-air",version:1,exportedAt:new Date().toISOString(),store:LocalDB.dump()};
  const name=`clear-air-backup-${todayKey()}.json`;
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  try{const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Clear Air backup"});toast("Backup ready");return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast("Backup saved");
}
function readBackup(file){
  if(!file)return;const box=document.getElementById("st-restore");
  const r=new FileReader();
  r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(e){d=null}
    if(!d||d.app!=="clear-air"||!d.store||!d.store["data/users/local/profile"]){box.innerHTML=`<span class="meta">That file isn't a Clear Air backup.</span>`;return}
    const n=Object.keys(d.store).filter(k=>k.includes("/days/")).length,c=Object.keys(d.store).filter(k=>k.includes("/checkins/")).length;
    box.innerHTML=`<div class="banner t-gold"><div class="title" style="color:var(--ink)">Replace everything on this phone?</div><div>Backup from ${esc(new Date(d.exportedAt).toLocaleDateString())}: ${n} logged days, ${c} diary entries.</div><div class="row" style="margin-top:10px"><button class="btn primary" id="st-restore-go">Restore</button><button class="btn" style="background:var(--surface)" id="st-restore-no">Cancel</button></div></div>`;
    document.getElementById("st-restore-no").onclick=()=>{box.innerHTML=""};
    document.getElementById("st-restore-go").onclick=()=>{LocalDB.replaceAll(d.store);closeSheet();toast("Backup restored")};
  };
  r.readAsText(file);
}

/* toast */
let tt=null;
function toast(msg){const r=document.getElementById("toast-root");r.innerHTML=`<div class="toast" role="status">${esc(msg)}</div>`;clearTimeout(tt);tt=setTimeout(()=>r.innerHTML="",2600)}


/* ---------- install + offline ---------- */
let deferredPrompt=null;
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function installHint(){
  let dismissed=false;try{dismissed=localStorage.getItem("clearair.hideInstall")==="1"}catch(e){}
  if(standalone()||dismissed||(!isIOS&&!deferredPrompt))return "";
  return `<section class="banner t-brand" id="install-card"><div class="bn-ic">${I("leaf")}<div><div class="title" style="color:var(--ink)">Put Clear Air on your home screen</div><div>${isIOS?"In Safari, tap the Share button, then “Add to Home Screen”.":"It opens full screen and works offline."}</div></div></div><div class="row" style="margin-top:12px;padding-left:34px">${isIOS?"":`<button class="btn primary" id="install-go">Install</button>`}<button class="btn" style="background:var(--surface)" id="install-no">Not now</button></div></section>`;
}
addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(S.tab==="home"&&S.mode==="live")render()});
document.addEventListener("click",async e=>{
  if(e.target.closest("#install-no")){try{localStorage.setItem("clearair.hideInstall","1")}catch(_){}render()}
  if(e.target.closest("#install-go")&&deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;render()}
});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&!root.innerHTML&&S.mode!=="loading")render()});
if("serviceWorker" in navigator&&location.protocol!=="file:"){addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
initStore();
})();
</script>
